<style>
  :root {
    --bg: #f3f0e9;
    --card: #f6f4ef;
    --accent: #d9583a;
    --ring: #efece5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); min-height: 100%; }
  body {
    font-family: "Lato", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--accent);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  /* Coluna central: todas as medidas usam cqw (% da largura da coluna) */
  .page {
    container-type: inline-size;
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    padding-bottom: 12cqw;
  }

  /* CAPA com arco */
  .cover {
    position: relative;
    height: 46.3cqw;
    background: linear-gradient(135deg, #c9a58a, #8a6a5a 60%, #5a463d);
    overflow: hidden;
  }
  .cover img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: center 30%;
  }
  .cover::after { /* elipse creme que cria a curva */
    content: "";
    position: absolute;
    left: -50%;
    width: 200%;
    top: 22.2cqw;
    height: 360cqw;
    background: var(--bg);
    border-radius: 50%;
  }

  /* FOTO DE PERFIL */
  .avatar {
    position: absolute;
    left: 50%;
    top: 22.2cqw;
    width: 32.5cqw;
    aspect-ratio: 1;
    transform: translateX(-50%);
    border-radius: 50%;
    background: var(--ring);
    box-shadow: 0 1.6cqw 5cqw rgba(60, 40, 30, .12);
    display: grid;
    place-items: center;
    z-index: 2;
  }
  .avatar .white {
    width: 29.6cqw; aspect-ratio: 1;
    border-radius: 50%;
    background: #fff;
    display: grid; place-items: center;
  }
  .avatar .photo {
    width: 26.7cqw; aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(135deg, #e7a07a, #b4654a);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* NOME */
  h1 {
    margin-top: 12.5cqw;
    text-align: center;
    font-weight: 400;
    font-size: 6.2cqw;
    line-height: 1.2;
    letter-spacing: -.01em;
    color: var(--accent);
  }

  /* LINKS */
  .links {
    margin: 14.5cqw 5.9cqw 0;
    display: flex;
    flex-direction: column;
    gap: 4.3cqw;
  }
  .link {
    display: flex;
    align-items: center;
    gap: 4cqw;
    height: 17cqw;
    padding: 1.1cqw;
    background: var(--card);
    border-radius: 1.2cqw;
    box-shadow: 0 .4cqw 3cqw rgba(120, 90, 70, .06);
    color: var(--accent);
    text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .link:hover { transform: translateY(-2px); box-shadow: 0 1cqw 4cqw rgba(120, 90, 70, .12); }
  .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .thumb {
    flex: none;
    width: 14.9cqw; height: 14.9cqw;
    border-radius: .9cqw;
    overflow: hidden;
    display: grid; place-items: center;
    position: relative;
  }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .thumb svg { width: 100%; height: 100%; display: block; }
  .link span {
    font-size: 3.75cqw;
    text-transform: uppercase;
    line-height: 1.2;

  /* BLOCO: prévia do feed (conteúdo bloqueado) */

    font-family: "Poppins", system-ui, sans-serif;

    height: 10cqw;
    background: #fff;
    border: 1px solid #e3ddd3;
    border-radius: 3.2cqw;

  .espera {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(243, 240, 233, .97);

  .espera .num {

  @media (prefers-reduced-motion: reduce) {
    .link { transition: none; }
    .espera.on .barra { animation: none; }
    .link:hover { transform: none; }
  }
</style>

  <script>
    /* DIVISÃO DE TRÁFEGO DO BOTÃO "MEU TELE"
       Cada visitante que abre a página é sorteado para um dos links abaixo.
       "peso" é a chance de cada link (50/50 = metade para cada).
       Para mais links, adicione outra linha. Os pesos não precisam somar 100. */
    var DIVISAO = [
      { url: "https://serverflow.dad/l/2279bfa2", peso: 50 },
      { url: "COLE_AQUI_O_SEGUNDO_LINK",          peso: 50 }
    ];

    (function () {
      var a = document.getElementById("tele");
      var ativos = DIVISAO.filter(function (l) { return /^https?:\/\//.test(l.url) && l.peso > 0; });
      if (!a || ativos.length < 2) return; // segundo link ainda não preenchido: mantém o link padrão
      var total = ativos.reduce(function (t, l) { return t + l.peso; }, 0);
      var r = Math.random() * total;
      for (var i = 0; i < ativos.length; i++) {
        r -= ativos[i].peso;
        if (r < 0) { a.href = ativos[i].url; break; }
      }
    })();
  </script>

  <script>
    /* TELA DE ESPERA: ao clicar em um botão, mostra o contador e abre o link depois de TEMPO segundos */
    (function () {
      var TEMPO = 3; // segundos
      var tela = document.getElementById("espera");
      var num = document.getElementById("espera-num");
      var t1, t2;

      function fechar() {
        tela.classList.remove("on");
        clearInterval(t1); clearTimeout(t2);
      }

      document.querySelectorAll("a.link, a.post").forEach(function (a) {
        a.addEventListener("click", function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
          e.preventDefault();
          var url = a.href, resta = TEMPO;
          clearInterval(t1); clearTimeout(t2);
          num.textContent = resta;
          tela.classList.remove("on"); void tela.offsetWidth; tela.classList.add("on");
          t1 = setInterval(function () { resta--; if (resta > 0) num.textContent = resta; }, 1000);
          t2 = setTimeout(function () { window.location.href = url; }, TEMPO * 1000);
        });
      });

      window.addEventListener("pageshow", function (ev) { if (ev.persisted) fechar(); });
      document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") fechar(); });
    })();
  </script>
