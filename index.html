<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velma Furacão 🍒</title>
<meta name="description" content="Meus links oficiais">
<meta name="theme-color" content="#f3f0e9">
<meta name="color-scheme" content="light">
<meta property="og:title" content="Velma Furacão 🍒">
<meta property="og:image" content="/cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f0e9;
    --card: #f6f4ef;
    --accent: #d9583a;
    --ring: #efece5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); min-height: 100%; }
  body {
    font-family: "Lato", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--accent);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  /* Coluna central: todas as medidas usam cqw (% da largura da coluna) */
  .page {
    container-type: inline-size;
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    padding-bottom: 12cqw;
  }

  /* CAPA com arco */
  .cover {
    position: relative;
    height: 46.3cqw;
    background: linear-gradient(135deg, #c9a58a, #8a6a5a 60%, #5a463d);
    overflow: hidden;
  }
  .cover img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: center 30%;
  }
  .cover::after { /* elipse creme que cria a curva */
    content: "";
    position: absolute;
    left: -50%;
    width: 200%;
    top: 22.2cqw;
    height: 360cqw;
    background: var(--bg);
    border-radius: 50%;
  }

  /* FOTO DE PERFIL */
  .avatar {
    position: absolute;
    left: 50%;
    top: 22.2cqw;
    width: 32.5cqw;
    aspect-ratio: 1;
    transform: translateX(-50%);
    border-radius: 50%;
    background: var(--ring);
    box-shadow: 0 1.6cqw 5cqw rgba(60, 40, 30, .12);
    display: grid;
    place-items: center;
    z-index: 2;
  }
  .avatar .white {
    width: 29.6cqw; aspect-ratio: 1;
    border-radius: 50%;
    background: #fff;
    display: grid; place-items: center;
  }
  .avatar .photo {
    width: 26.7cqw; aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(135deg, #e7a07a, #b4654a);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* NOME */
  h1 {
    margin-top: 12.5cqw;
    text-align: center;
    font-weight: 400;
    font-size: 6.2cqw;
    line-height: 1.2;
    letter-spacing: -.01em;
    color: var(--accent);
  }

  /* LINKS */
  .links {
    margin: 14.5cqw 5.9cqw 0;
    display: flex;
    flex-direction: column;
    gap: 4.3cqw;
  }
  .link {
    display: flex;
    align-items: center;
    gap: 4cqw;
    height: 17cqw;
    padding: 1.1cqw;
    background: var(--card);
    border-radius: 1.2cqw;
    box-shadow: 0 .4cqw 3cqw rgba(120, 90, 70, .06);
    color: var(--accent);
    text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .link:hover { transform: translateY(-2px); box-shadow: 0 1cqw 4cqw rgba(120, 90, 70, .12); }
  .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .thumb {
    flex: none;
    width: 14.9cqw; height: 14.9cqw;
    border-radius: .9cqw;
    overflow: hidden;
    display: grid; place-items: center;
    position: relative;
  }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .thumb svg { width: 100%; height: 100%; display: block; }
  .link span {
    font-size: 3.75cqw;
    text-transform: uppercase;
    line-height: 1.2;
  }


  /* BLOCO: prévia do feed (conteúdo bloqueado) */
  .feed {
    margin: 9cqw 5.9cqw 0;
    font-family: "Poppins", system-ui, sans-serif;
    color: #2b2b2b;
  }
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 10cqw;
    background: #fff;
    border: 1px solid #e3ddd3;
    border-radius: 3.2cqw;
    overflow: hidden;
    margin-bottom: 3cqw;
  }
  .tab {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    gap: 2cqw;
    font-size: 3.7cqw;
    font-weight: 500;
  }
  .tab svg { width: 4.4cqw; height: 4.4cqw; }
  .tab.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0;
    height: .7cqw; background: #f59a4a;
  }
  .post {
    display: block;
    background: #fff;
    border-radius: 3.4cqw;
    overflow: hidden;
    color: inherit;
    text-decoration: none;
  }
  .post:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .post-head {
    display: flex; align-items: center; gap: 2.6cqw;
    padding: 3cqw 3cqw 3cqw 3cqw;
  }
  .post-head .pic {
    flex: none;
    width: 11.5cqw; height: 11.5cqw;
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(135deg, #e7a07a, #b4654a);
  }
  .post-head .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .who { flex: 1; min-width: 0; line-height: 1.35; }
  .who b { font-weight: 500; font-size: 3.6cqw; display: flex; align-items: center; gap: 1cqw; }
  .who b svg { width: 4cqw; height: 4cqw; flex: none; }
  .who small { display: block; font-size: 3.3cqw; font-weight: 400; color: #3a3a3a; }
  .dots { width: 4.4cqw; flex: none; align-self: flex-start; margin-top: 1cqw; }
  .locked {
    position: relative;
    aspect-ratio: 1 / 1;
    background: #f4ede2;
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.2cqw;
    color: #6b7390;
  }
  .locked .bubble {
    position: absolute;
    width: 118%; left: -9%; top: -6%;
    pointer-events: none;
  }
  .locked .lock { position: relative; width: 11cqw; height: 11cqw; }
  .stats {
    position: relative;
    display: flex; gap: 3.4cqw;
    font-size: 3.2cqw; font-weight: 400;
  }
  .stats span { display: inline-flex; align-items: center; gap: 1cqw; }
  .stats svg { width: 3.8cqw; height: 3.8cqw; }
  .post-foot {
    display: flex; align-items: center; gap: 2.2cqw;
    padding: 3.2cqw 3.4cqw;
  }
  .post-foot svg { width: 5.6cqw; height: 5.6cqw; }
  .post-foot .save { margin-left: auto; }

  @media (prefers-reduced-motion: reduce) {
    .link { transition: none; }
    .link:hover { transform: none; }
  }
</style>
</head>
<body>

      <div class="tabs">

</body>
</html>
